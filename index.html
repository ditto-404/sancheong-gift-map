<style>
/* Layout: white page, one large stone-grey rounded stage. Inside it, a left column
   (headline, search, type pills, list card) and a map card with a dark receipt overlay
   that doubles as the township filter. Single light look by design. */
:root {
  --page: #ffffff;
  --stone: #ecebe8;
  --stone-2: #e4e4e0;
  --card: #ffffff;
  --soft: #f8f8f8;
  --ink: #111111;
  --ink-2: #4a4a4a;
  --ink-3: #8a8a86;
  --line: #d9d8d3;
  --night: #2d2d2d;
  --night-2: #434343;
  --lime: #e6fb2d;
  --kakao: #fee500;
  --r-stage: 28px;
  --r-card: 22px;
  --display: "Red Hat Display", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Pretendard Variable", Pretendard, "Red Hat Display", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --hand: "Nanum Pen Script", "Caveat", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 14.5px; word-break: keep-all; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* Nav */
.nav { height: 72px; padding: env(safe-area-inset-top, 0px) 40px 0; display: flex; align-items: center; gap: 36px; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em; text-decoration: none; white-space: nowrap; }
.logo-dots { display: grid; grid-template-columns: 6px 6px; grid-template-rows: 6px 6px; gap: 2px 3px; }
.logo-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.logo-dots i:nth-child(2) { grid-row: 1 / 3; grid-column: 2; align-self: center; background: var(--ink); }
.nav-links { display: flex; gap: 6px; }
.nav-links a { padding: 8px 15px 7px; border-radius: 18px; border: 1px solid transparent; font-size: 14px; color: var(--ink-2); text-decoration: none; }
.nav-links a:hover { border-color: var(--ink); color: var(--ink); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill-dark { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--night); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; }
.pill-dark:hover { background: #000; }
.pill-dark svg { width: 16px; height: 16px; }
.pill-dark.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Stage */
.stage {
  margin: 0 24px 24px; padding: 28px; background: var(--stone); border-radius: var(--r-stage);
  height: calc(100vh - 96px); height: calc(100dvh - 96px);
  display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; min-height: 560px;
}
.col { display: flex; flex-direction: column; min-height: 0; gap: 16px; }

.badge-row { display: flex; align-items: center; gap: 8px; }
.tag { display: inline-flex; align-items: center; height: 30px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--ink-3); font-size: 12.5px; color: var(--ink-2); font-family: var(--display); font-weight: 500; }
.icon-dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--ink-3); display: grid; place-items: center; }
.icon-dot svg { width: 15px; height: 15px; }

h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 38px; line-height: 1.12; letter-spacing: -.035em; text-wrap: balance; }
h1 .scribble { position: relative; white-space: nowrap; }
h1 .scribble svg { position: absolute; left: -12px; top: -9px; width: calc(100% + 24px); height: calc(100% + 16px); pointer-events: none; overflow: visible; }
.lede { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.55; max-width: 34ch; }
.lede b { color: var(--ink); font-weight: 600; }

.search { position: relative; }
.search input { width: 100%; height: 50px; padding: 0 56px 0 20px; border-radius: 999px; border: 0; background: var(--card); font-size: 15px; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: 2px solid var(--ink); outline-offset: 0; }
.search .go { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--lime); display: grid; place-items: center; cursor: pointer; }
.search .go svg { width: 17px; height: 17px; }

.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px 0 13px; border-radius: 999px;
  border: 1px solid #bdbcb7; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.pill:hover { border-color: var(--ink); color: var(--ink); }
.pill .n { font-family: var(--display); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pill[aria-pressed="true"] { background: var(--card); border-color: var(--card); color: var(--ink); font-weight: 650; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.pill[aria-pressed="true"] .n { color: var(--ink); }
.pill[aria-pressed="true"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }

/* List card */
.list-card { flex: 1; min-height: 0; background: var(--card); border-radius: var(--r-card); display: flex; flex-direction: column; overflow: hidden; }
.list-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.list-head .count { font-family: var(--display); font-weight: 600; font-size: 15px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--stone-2); position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + .track { background: var(--night); }
.switch input:checked + .track::after { transform: translateX(14px); background: var(--lime); }
.switch input:focus-visible + .track { outline: 2px solid var(--ink); outline-offset: 2px; }
.list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 10px; border-radius: 14px; cursor: pointer; }
.item + .item { border-top: 1px solid #efeeeb; }
.item:hover { background: var(--soft); }
.item.active { background: var(--stone); border-top-color: transparent; }
.item.active + .item { border-top-color: transparent; }
.item .name { font-weight: 650; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.item .meta { margin-top: 3px; font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.item .meta .t { color: var(--ink-2); }
.item .meta .d { font-family: var(--display); color: var(--ink); font-weight: 600; }
.item .addr { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.go-kakao { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; text-decoration: none; color: var(--ink); flex: none; }
.go-kakao:hover { background: var(--kakao); border-color: var(--kakao); }
.go-kakao svg { width: 14px; height: 14px; }
.more { display: block; width: 100%; margin: 8px 0 4px; height: 40px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.more:hover { border-color: var(--ink); color: var(--ink); }
.empty { padding: 48px 20px; text-align: center; color: var(--ink-3); line-height: 1.7; }
.outside { margin: 10px 4px 6px; padding: 14px 16px; border-radius: 16px; background: var(--soft); font-size: 13px; color: var(--ink-2); }
.outside summary { cursor: pointer; font-weight: 650; color: var(--ink); }
.outside ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.outside li span { display: block; color: var(--ink-3); font-size: 12px; }

/* Map card */
.map-card { position: relative; border-radius: var(--r-card); overflow: hidden; background: var(--card); min-height: 0; }
#map { position: absolute; inset: 0; background: #f2f1ee; z-index: 0; }
.leaflet-tile-pane { filter: grayscale(1) contrast(.88) brightness(1.07); }
.hand-note { position: absolute; top: 18px; left: 22px; z-index: 450; font-family: var(--hand); font-size: 23px; line-height: 1; color: var(--ink-2); pointer-events: none; display: flex; align-items: flex-end; gap: 4px; }
.hand-note svg { width: 34px; height: 30px; }
.map-tools { position: absolute; top: 16px; right: 16px; z-index: 450; display: grid; gap: 6px; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.08); font-size: 20px; line-height: 1; }
.round:hover { background: var(--ink); color: #fff; }
.round svg { width: 17px; height: 17px; }

/* Receipt: township filter */
.receipt {
  position: absolute; left: 16px; bottom: 16px; z-index: 460; width: 236px;
  background: var(--night); border-radius: 18px; padding: 10px; color: #fff;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.receipt-paper { background: #fff; color: var(--ink); border-radius: 6px 6px 0 0; padding: 14px 14px 18px; position: relative;
  -webkit-mask: radial-gradient(circle 5px at 7px 100%, transparent 98%, #000) -7px 0 / 14px 100% repeat-x;
          mask: radial-gradient(circle 5px at 7px 100%, transparent 98%, #000) -7px 0 / 14px 100% repeat-x; }
.receipt-top { display: flex; justify-content: space-between; align-items: baseline; }
.receipt-top b { font-family: var(--display); font-weight: 700; letter-spacing: .12em; font-size: 13px; }
.receipt-top span { font-family: var(--display); font-size: 11px; color: var(--ink-3); }
.receipt-toggle { border: 0; background: none; padding: 0; cursor: pointer; font-size: 11px; color: var(--ink-3); font-family: var(--display); }
.rows { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.rows button { width: 100%; display: flex; align-items: baseline; gap: 6px; padding: 3px 4px; margin: 0 -4px; border: 0; background: none; cursor: pointer; border-radius: 4px; text-align: left; color: var(--ink-2); width: calc(100% + 8px); }
.rows button::after { content: ""; order: 2; flex: 1; border-bottom: 1px dotted #c9c8c3; transform: translateY(-3px); }
.rows .k { order: 1; }
.rows .v { order: 3; font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.rows button:hover { background: var(--soft); color: var(--ink); }
.rows button[aria-pressed="true"] { background: var(--lime); color: var(--ink); font-weight: 650; }
.rows button[aria-pressed="true"]::after { border-bottom-color: rgba(0,0,0,.35); }
.receipt-total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px dashed #c9c8c3; font-size: 12.5px; font-weight: 650; }
.receipt-total .v { font-family: var(--display); }
.receipt.closed .rows, .receipt.closed .receipt-total { display: none; }
.receipt-foot { padding: 8px 4px 0; font-size: 11px; color: #bdbdbd; line-height: 1.45; }

/* Markers */
.pin { width: 14px; height: 14px; border-radius: 50%; background: var(--night); border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.pin.approx { background: #fff; border: 2.5px dashed var(--night); }
.pin.on { width: 22px; height: 22px; margin: -4px 0 0 -4px; background: var(--lime); border: 3px solid var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
.me { width: 18px; height: 18px; border-radius: 50%; background: var(--lime); border: 4px solid var(--ink); box-shadow: 0 0 0 6px rgba(17,17,17,.12); }
.cluster { display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.14); border: 1px solid #e3e2de; }
.cluster.big { background: var(--night); color: #fff; border-color: var(--night); }

/* Popup */
.leaflet-container { font-family: var(--body); }
.leaflet-popup-content-wrapper { border-radius: 20px; box-shadow: 0 14px 40px rgba(0,0,0,.16); padding: 0; }
.leaflet-popup-content { margin: 0; padding: 18px 18px 16px; font-size: 13.5px; line-height: 1.5; min-width: 230px; }
.leaflet-container a.leaflet-popup-close-button { top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; color: var(--ink-3); font: 18px/24px var(--display); }
.leaflet-container a.leaflet-popup-close-button:hover { background: var(--stone); color: var(--ink); }
.pop .cat { display: inline-flex; height: 24px; align-items: center; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 11.5px; color: var(--ink-2); }
.pop h3 { margin: 10px 24px 0 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.25; letter-spacing: -.02em; }
.pop .addr { margin-top: 6px; color: var(--ink-2); }
.pop .tel { margin-top: 2px; font-family: var(--display); }
.pop .tel a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line); }
.pop .note { margin-top: 10px; font-family: var(--hand); font-size: 19px; line-height: 1.1; color: var(--ink-2); }
.pop .actions { display: flex; gap: 6px; margin-top: 14px; }
.pop .actions a { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 6px; height: 40px; border-radius: 999px; font-weight: 650; font-size: 13px; text-decoration: none; }
.pop .actions .k { background: var(--night); color: #fff !important; }
.pop .actions .k:hover { background: #000; }
.pop .actions .k i { width: 18px; height: 18px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; }
.pop .actions .k i svg { width: 10px; height: 10px; }
.pop .actions .d { border: 1px solid #bdbcb7; color: var(--ink) !important; }
.pop .actions .d:hover { border-color: var(--ink); }
.spot { position: relative; width: 0; height: 0; }
.spot-dot { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.spot-pulse { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: var(--lime); border: 2px solid var(--ink); opacity: .7; animation: spotPulse 1.8s ease-out infinite; }
@keyframes spotPulse { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.6); opacity: 0; } }
.spot-name { position: absolute; left: 16px; top: -16px; white-space: nowrap; background: var(--night); color: #fff; border-radius: 999px; padding: 7px 14px 7px 12px; font: 650 14px var(--body); box-shadow: 0 6px 18px rgba(0,0,0,.22); display: inline-flex; align-items: center; gap: 7px; }
.spot-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
.leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.75) !important; border-radius: 8px 0 0 0; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 900; background: var(--night); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.2); white-space: nowrap; }

.foot { padding: 0 40px 28px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-3); }
.foot a { color: var(--ink-2); }

/* Tablet & phone */
@media (max-width: 980px) {
  .nav { padding: env(safe-area-inset-top, 0px) 20px 0; height: 64px; gap: 16px; }
  .nav-links { display: none; }
  .stage { margin: 0 12px 16px; padding: 18px; height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr); border-radius: 24px; }
  .stage > *, .col > * { min-width: 0; }
  .col { display: contents; }
  .intro { order: 1; }
  .search { order: 2; }
  .map-card { order: 3; height: 62vh; height: 62dvh; min-height: 380px; }
  .pills-wrap { order: 4; }
  .list-card { order: 5; max-height: 80vh; max-height: 80dvh; min-height: 320px; }
  h1 { font-size: 30px; }
  .pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
  .pills::-webkit-scrollbar { display: none; }
  .receipt { width: 210px; left: 10px; bottom: 10px; }
  .hand-note { display: none; }
  .foot { padding: 0 20px 24px; }
}
@media (max-width: 480px) {
  .nav .pill-dark span { display: none; }
  .nav .pill-dark { width: 40px; padding: 0; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { .spot-pulse { animation: none; opacity: 0; } .pill-dark.busy svg { animation: none; } .switch .track, .switch .track::after { transition: none; } }
</style>

  <a class="logo" href="./" aria-label="산청사랑상품권 가맹점 지도 처음으로">
    <span class="logo-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    SANCHEONG PAY MAP
  </a>
  <nav class="nav-links" aria-label="바로가기">
    <a href="#map-card">지도</a>
    <a href="#list-card">가맹점 목록</a>
    <a href="https://github.com/ditto-404/sancheong-gift-map#readme" target="_blank" rel="noopener">데이터 안내</a>
  </nav>
  <div class="nav-right">
    <button class="pill-dark" id="locate" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      <span>내 주변 가맹점</span>
    </button>
  </div>
</header>

<main class="stage">
  <div class="col">
    <section class="intro">
      <div class="badge-row">
        <span class="tag">2026.06 등록 현황</span>
        <span class="icon-dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></span>
        <span class="icon-dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
      </div>
      <h1 style="margin-top:14px">산청사랑상품권,<br><span class="scribble">어디서<svg viewBox="0 0 120 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 34C6 16 40 6 70 8c30 2 46 12 42 26-4 15-40 20-70 17C16 48 4 40 10 26 16 14 46 4 80 7" fill="none" stroke="#e6fb2d" stroke-width="3.2" stroke-linecap="round"/></svg></span> 쓸 수 있을까</h1>
      <p class="lede">산청군 가맹점 <b class="num" id="total">1,730</b>곳을 지도에 모았습니다. 가게를 누르면 카카오맵 장소 페이지로 바로 넘어갑니다.</p>
    </section>

    <div class="search" role="search">
      <input id="q" type="search" placeholder="가게 이름, 주소, 업종" autocomplete="off" aria-label="가맹점 검색">
      <button class="go" id="qGo" type="button" aria-label="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      </button>
    </div>

    <div class="pills-wrap">
      <div class="pills" id="grpPills" role="group" aria-label="업종"></div>
    </div>

    <section class="list-card" id="list-card" aria-label="가맹점 목록">
      <div class="list-head">
        <span class="count"><span id="count" class="num">0</span>곳</span>
        <label class="switch"><input type="checkbox" id="inView"><span class="track"></span>지도 화면 안만</label>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </section>
  </div>

  <section class="map-card" id="map-card" aria-label="가맹점 지도">
    <div id="map" role="application" aria-label="산청군 가맹점 지도"></div>
    <div class="hand-note" aria-hidden="true">점을 누르면 카카오맵 연결
      <svg viewBox="0 0 40 34" fill="none" stroke="#4a4a4a" stroke-width="1.8" stroke-linecap="round"><path d="M3 4c10 2 22 8 28 22"/><path d="M24 22l7 5 3-8"/></svg>
    </div>
    <div class="map-tools">
      <button class="round" id="zin" type="button" aria-label="확대">+</button>
      <button class="round" id="zout" type="button" aria-label="축소">&minus;</button>
      <button class="round" id="zall" type="button" aria-label="산청군 전체 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <aside class="receipt" id="receipt" aria-label="읍면별 가맹점">
      <div class="receipt-paper">
        <div class="receipt-top"><b>RECEIPT</b><button class="receipt-toggle" id="receiptToggle" type="button" aria-expanded="true">접기</button></div>
        <ul class="rows" id="emdRows"></ul>
        <div class="receipt-total"><span>합계</span><span class="v" id="emdTotal">0</span></div>
      </div>
      <div class="receipt-foot">읍면을 누르면 그 지역만 봅니다</div>
    </aside>
  </section>
</main>

<footer class="foot">
  <span>가맹점 목록: 산청군 2026년 6월 등록 현황</span>
  <span>좌표·장소: 카카오 로컬 API</span>
  <span>점선 핀은 도로 단위 근사 위치</span>
  <span>결제 가능 여부는 매장에 확인하세요</span>
  <a href="https://github.com/ditto-404/sancheong-gift-map" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="data/merchants.js"></script>
<script>
(function () {
  "use strict";
  var DATA = window.MERCHANTS;
  var GROUPS = [
    ["food", "음식점"], ["cafe", "카페·빵"], ["farm", "농특산·약초"], ["mart", "마트·생활"],
    ["stay", "숙박·캠핑"], ["health", "병원·약국"], ["beauty", "미용"], ["edu", "학원"],
    ["car", "자동차·주유"], ["leisure", "레저·문화"], ["etc", "생활서비스"]
  ];
  var G = {}; GROUPS.forEach(function (g) { G[g[0]] = g[1]; });
  var EMDS = ["산청읍", "차황면", "오부면", "생초면", "금서면", "삼장면", "시천면", "단성면", "신안면", "생비량면", "신등면"];
  var ARROW = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l6-6M4 3h5v5"/></svg>';

  var all = DATA.merchants.map(function (m, i) {
    m.idx = i;
    m.short = m.addr.replace(/^(경상남도|경남)\s+산청군\s+/, "");
    m.hay = (m.name + " " + m.addr + " " + m.cat + " " + G[m.grp]).toLowerCase().replace(/\s+/g, "");
    return m;
  });

  var state = { q: "", emd: "", grp: "", inView: false, me: null };
  var PAGE = 60, shown = 0, current = [];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return n.toLocaleString("ko-KR"); }

  // ---------- Map ----------
  var map = L.map("map", { zoomControl: false, minZoom: 9, maxZoom: 19 }).setView([35.39, 127.88], 11);
  // OpenStreetMap standard tiles, toned down to greyscale in CSS (.leaflet-tile-pane) to fit the page.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(map);
  $("zin").onclick = function () { map.zoomIn(); };
  $("zout").onclick = function () { map.zoomOut(); };

  // Keep popups clear of the receipt card (bottom-left) while it is open.
  var PAD_TL = [20, 20], PAD_BR = [20, 20];
  function syncPad() {
    var r = $("receipt"), open = !r.classList.contains("closed");
    PAD_TL[0] = open && window.innerWidth > 980 ? r.offsetWidth + 32 : 20;
  }

  var cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 50, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 18,
    iconCreateFunction: function (c) {
      var n = c.getChildCount(), s = n < 10 ? 34 : n < 100 ? 40 : 48;
      return L.divIcon({ html: '<div class="cluster' + (n >= 100 ? " big" : "") + '" style="width:' + s + "px;height:" + s + 'px">' + n + "</div>", className: "", iconSize: [s, s] });
    }
  });
  map.addLayer(cluster);

  // Highlighted area: 500 m around 덕산문화의집. Drawn in its own pane above the
  // merchant pins (markerPane 600) and below popups (700); it ignores clicks so pins stay usable.
  var spot = [35.276086, 127.844861];
  map.createPane("spotPane");
  map.getPane("spotPane").style.zIndex = 650;
  map.getPane("spotPane").style.pointerEvents = "none";
  L.circle(spot, { pane: "spotPane", radius: 500, color: "#111111", weight: 2, dashArray: "5 5", fillColor: "#e6fb2d", fillOpacity: 0.45, interactive: false }).addTo(map);
  L.marker(spot, {
    pane: "spotPane", interactive: false, keyboard: false,
    icon: L.divIcon({ className: "", html: '<div class="spot"><span class="spot-pulse"></span><span class="spot-dot"></span><span class="spot-name">덕산문화의집</span></div>', iconSize: [0, 0], iconAnchor: [0, 0] })
  }).addTo(map);

  function pinIcon(m, on) {
    return L.divIcon({ className: "", html: '<div class="pin' + (m.prec === 2 ? " approx" : "") + (on ? " on" : "") + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -8] });
  }
  function kakaoUrl(m) {
    if (m.pid) return "https://place.map.kakao.com/" + m.pid;
    if (m.lat == null) return "https://map.kakao.com/?q=" + encodeURIComponent(m.short);
    return "https://map.kakao.com/link/map/" + encodeURIComponent(m.name) + "," + m.lat + "," + m.lng;
  }
  function routeUrl(m) { return "https://map.kakao.com/link/to/" + encodeURIComponent(m.name) + "," + m.lat + "," + m.lng; }
  function popupHtml(m) {
    return '<div class="pop"><span class="cat">' + esc(G[m.grp] + (m.cat ? " · " + m.cat.split(" · ").pop() : "")) + "</span>" +
      "<h3>" + esc(m.name) + "</h3>" +
      '<div class="addr">' + esc(m.short) + "</div>" +
      (m.tel ? '<div class="tel"><a href="tel:' + esc(m.tel) + '">' + esc(m.tel) + "</a></div>" : "") +
      (m.prec === 2 ? '<div class="note">번지를 못 찾아서 도로 위치에 찍었어요</div>' : "") +
      '<div class="actions"><a class="k" href="' + kakaoUrl(m) + '" target="_blank" rel="noopener">' + (m.pid ? "카카오맵 장소" : "카카오맵 보기") + "<i>" + ARROW + "</i></a>" +
      '<a class="d" href="' + routeUrl(m) + '" target="_blank" rel="noopener">길찾기</a></div></div>';
  }

  all.forEach(function (m) {
    if (m.lat == null) return;
    m.marker = L.marker([m.lat, m.lng], { icon: pinIcon(m, false), title: m.name, keyboard: false });
    m.marker.bindPopup(function () { return popupHtml(m); }, { maxWidth: 300, autoPanPaddingTopLeft: PAD_TL, autoPanPaddingBottomRight: PAD_BR });
    m.marker.on("popupopen", function () { highlight(m, true); });
    m.marker.on("popupclose", function () { highlight(m, false); });
  });

  var activeItem = null;
  function highlight(m, on) {
    m.marker.setIcon(pinIcon(m, on));
    m.marker.setZIndexOffset(on ? 1000 : 0);
    if (activeItem) activeItem.classList.remove("active");
    activeItem = null;
    if (on) {
      var el = document.querySelector('.item[data-i="' + m.idx + '"]');
      if (el) { el.classList.add("active"); activeItem = el; }
    }
  }

  // ---------- Filters ----------
  function matches(m, skip) {
    if (state.q && m.hay.indexOf(state.q) < 0) return false;
    if (skip !== "emd" && state.emd && m.emd !== state.emd) return false;
    if (skip !== "grp" && state.grp && m.grp !== state.grp) return false;
    return true;
  }

  function renderFilters() {
    var ec = {}, gc = {}, et = 0, gt = 0;
    all.forEach(function (m) {
      if (matches(m, "emd")) { ec[m.emd] = (ec[m.emd] || 0) + 1; et++; }
      if (matches(m, "grp")) { gc[m.grp] = (gc[m.grp] || 0) + 1; gt++; }
    });
    var box = $("grpPills"), sl = box.scrollLeft;
    box.innerHTML = '<button type="button" class="pill" data-v="" aria-pressed="' + !state.grp + '">전체 <span class="n">' + fmt(gt) + "</span></button>" +
      GROUPS.map(function (g) {
        return '<button type="button" class="pill" data-v="' + g[0] + '" aria-pressed="' + (state.grp === g[0]) + '">' + g[1] + ' <span class="n">' + fmt(gc[g[0]] || 0) + "</span></button>";
      }).join("");
    box.scrollLeft = sl;
    $("emdRows").innerHTML = EMDS.map(function (e) {
      return '<li><button type="button" data-v="' + e + '" aria-pressed="' + (state.emd === e) + '"><span class="k">' + e + '</span><span class="v">' + fmt(ec[e] || 0) + "</span></button></li>";
    }).join("");
    $("emdTotal").textContent = fmt(state.emd ? (ec[state.emd] || 0) : et);
  }

  function distKm(a, b) {
    var R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  function fitTo(list) {
    var pts = list.filter(function (m) { return m.lat != null; }).map(function (m) { return [m.lat, m.lng]; });
    if (pts.length) map.fitBounds(pts, { padding: [48, 48], maxZoom: 16 });
  }
  $("zall").onclick = function () { fitTo(all); };

  var lastKey = "";
  function apply(fit) {
    var base = all.filter(function (m) { return matches(m); });
    var b = map.getBounds();
    current = state.inView ? base.filter(function (m) { return m.lat != null && b.contains([m.lat, m.lng]); }) : base.slice();
    if (state.me) {
      current.forEach(function (m) { m.d = m.lat != null ? distKm(state.me, [m.lat, m.lng]) : 1e9; });
      current.sort(function (x, y) { return x.d - y.d; });
    }
    var key = state.q + "|" + state.emd + "|" + state.grp;
    if (key !== lastKey) {
      lastKey = key;
      cluster.clearLayers();
      cluster.addLayers(base.filter(function (m) { return m.marker; }).map(function (m) { return m.marker; }));
      if (fit && base.length) fitTo(base);
    }
    $("count").textContent = fmt(current.length);
    renderFilters();
    renderList(true);
  }

  function itemHtml(m) {
    var d = state.me && m.d != null && m.d < 1e8 ? '<span class="d">' + (m.d < 1 ? Math.round(m.d * 1000) + "m" : m.d.toFixed(1) + "km") + "</span>" : "";
    return '<div class="item" data-i="' + m.idx + '" role="button" tabindex="0">' +
      '<div><div class="name">' + esc(m.name) + "</div>" +
      '<div class="meta">' + d + '<span class="t">' + esc(G[m.grp]) + "</span><span>" + esc(m.emd) + "</span></div>" +
      '<div class="addr">' + esc(m.short.replace(/^\S+[읍면]\s+/, "")) + "</div></div>" +
      '<a class="go-kakao" href="' + kakaoUrl(m) + '" target="_blank" rel="noopener" aria-label="' + esc(m.name) + ' 카카오맵에서 보기" title="카카오맵">' + ARROW + "</a></div>";
  }

  function renderList(reset) {
    var list = $("list");
    if (reset) { list.innerHTML = ""; shown = 0; list.scrollTop = 0; }
    var extra = list.querySelectorAll(".more, .outside"); extra.forEach(function (e) { e.remove(); });
    if (!current.length) { list.innerHTML = '<div class="empty">조건에 맞는 가맹점이 없어요.<br>검색어나 필터를 바꿔 보세요.</div>'; return; }
    var next = current.slice(shown, shown + PAGE);
    list.insertAdjacentHTML("beforeend", next.map(itemHtml).join(""));
    shown += next.length;
    if (shown < current.length) {
      var btn = document.createElement("button");
      btn.className = "more"; btn.type = "button";
      btn.textContent = "더 보기 · " + fmt(current.length - shown) + "곳";
      btn.onclick = function () { renderList(false); };
      list.appendChild(btn);
    } else if (!state.q && !state.emd && !state.grp && !state.inView && DATA.outside.length) {
      list.insertAdjacentHTML("beforeend", '<details class="outside"><summary>온라인·산청군 외 주소 ' + DATA.outside.length + "곳</summary><ul>" +
        DATA.outside.map(function (o) { return "<li>" + esc(o.name) + "<span>" + esc(o.addr) + "</span></li>"; }).join("") + "</ul></details>");
    }
  }

  function focusMerchant(m) {
    if (!m.marker) { toast("이 가맹점은 지도 위치를 찾지 못했어요"); return; }
    if (window.innerWidth <= 980) $("map-card").scrollIntoView({ behavior: "smooth", block: "center" });
    cluster.zoomToShowLayer(m.marker, function () {
      map.setView([m.lat, m.lng], Math.max(map.getZoom(), 16));
      m.marker.openPopup();
    });
  }

  // ---------- Events ----------
  var qTimer;
  function setQuery(v) { state.q = v.trim().toLowerCase().replace(/\s+/g, ""); apply(true); }
  $("q").addEventListener("input", function (e) { clearTimeout(qTimer); qTimer = setTimeout(function () { setQuery(e.target.value); }, 180); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { clearTimeout(qTimer); setQuery(e.target.value); } });
  $("qGo").addEventListener("click", function () { setQuery($("q").value); $("q").focus(); });
  $("grpPills").addEventListener("click", function (e) { var b = e.target.closest(".pill"); if (b) { state.grp = b.dataset.v; apply(false); } });
  $("emdRows").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.emd = state.emd === b.dataset.v ? "" : b.dataset.v; apply(true);
  });
  $("receiptToggle").addEventListener("click", function () {
    var r = $("receipt"), closed = r.classList.toggle("closed");
    this.textContent = closed ? "펼치기" : "접기"; this.setAttribute("aria-expanded", String(!closed));
    syncPad();
  });
  if (window.innerWidth <= 980) $("receiptToggle").click();
  syncPad(); window.addEventListener("resize", syncPad);
  $("inView").addEventListener("change", function (e) { state.inView = e.target.checked; apply(false); });
  map.on("moveend", function () { if (state.inView) apply(false); });

  $("list").addEventListener("click", function (e) {
    if (e.target.closest("a")) return;
    var it = e.target.closest(".item"); if (it) focusMerchant(all[+it.dataset.i]);
  });
  $("list").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var it = e.target.closest(".item"); if (!it) return;
    e.preventDefault(); focusMerchant(all[+it.dataset.i]);
  });

  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }
  var meMarker = null;
  $("locate").addEventListener("click", function () {
    var btn = this;
    if (!navigator.geolocation) { toast("이 브라우저는 위치 기능을 지원하지 않아요"); return; }
    btn.classList.add("busy");
    navigator.geolocation.getCurrentPosition(function (p) {
      btn.classList.remove("busy");
      state.me = [p.coords.latitude, p.coords.longitude];
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.marker(state.me, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, zIndexOffset: 2000 }).addTo(map);
      map.setView(state.me, 15);
      apply(false);
      toast("가까운 순으로 정렬했어요");
    }, function () {
      btn.classList.remove("busy");
      toast("위치 권한을 허용하면 가까운 순으로 볼 수 있어요");
    }, { enableHighAccuracy: true, timeout: 10000 });
  });

  $("total").textContent = fmt(DATA.count);
  apply(false);
  map.setView(spot, 15);
})();
</script>
</body>
</html>
